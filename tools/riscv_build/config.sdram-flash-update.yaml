# The update tests (c-sdram-update/): a program of bank A receives the image of bank B over the UART, updates the FLASH
# with the controller and restarts through the boot memory. The simulation top has the FLASH controller, the two-port storage
# and the command chip behind it (HAS_FLASH_CONTROLLER), with a chip that erases a sector in 100 clocks of waiting and
# programs a page in 20: the fast chip. config.sdram-flash-update-slow.yaml has the slow one.
extends: config.platform-de0-cv-emulated.yaml

paths:
  include_dir: tools/riscv_build/include-sdram-emulated
  build_dir: build-sdram-flash-update
  c_dir: c-sdram-update
  asm_dir: asm-sdram-update

sim:
  parameters:
    HAS_FLASH_CONTROLLER: true
    FLASH_ERASE_LATENCY: "100"
    FLASH_PROGRAM_LATENCY: "20"
  # the console sends the image byte by byte (the program only stores them, so one every twelve scans: the console now starts when the
  # boot memory jumps to the program, which clears its .bss before it reads, and a byte that finds the 64-place queue full is lost) and the boot memory
  # then checks both banks again: longer than the other programs
  env:
    SIM_TIMEOUT_CYCLES: "20000000"
    UART_SCANS_PER_BYTE: "12"
