# The programs that use the SDRAM, on the platform with the FLASH behind the caches, with a slow
# FLASH chip: every program must give the same result at any latency of the chip.
extends: config.sdram-flash.yaml

sim:
  parameters:
    FLASH_FIRST_LATENCY: "120"
    FLASH_NEXT_LATENCY: "20"
  env:
    SIM_TIMEOUT_CYCLES: "8000000"
