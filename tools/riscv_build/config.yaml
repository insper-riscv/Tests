# Configuration of this project's test pipeline (the asm/ and c/ programs).
#
# Everything about the machine the tests run on -- toolchain, memory map, Quartus
# project, simulation, runtime -- is the platform's, in insper-riscv/TopLevel. This
# file extends it and adds only what is the tests'. The paths of the platform are
# written relative to this project's root, with the repositories side by side
# (../Core, ../Memory, ../TopLevel), the layout RV32IM's submodules have.
extends: ../../../TopLevel/platforms/internal-mem/config.yaml

paths:
  include_dir: tools/riscv_build/include
  build_dir: build
  c_dir: c
  asm_dir: asm
