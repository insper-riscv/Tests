name: RISC-V toolchain (built as insper-riscv/Infra does)
description: >
  Builds the RISC-V GCC (rv32im/ilp32 with picolibc) and Spike (debug module
  moved out of address 0) with the recipes of Infra's GCC_SETUP.md and
  SPIKE_SETUP.md, into /opt/riscv-foundation like the workstation install,
  cached across runs, and puts both on PATH.

runs:
  using: composite
  steps:
    - name: Resolve the upstream commits (cache keys)
      id: pins
      shell: bash
      # The recipes build each project's default branch, so the commit it
      # points at now is the identity of what a cache entry holds.
      run: |
        gcc=$(git ls-remote https://github.com/riscv-collab/riscv-gnu-toolchain HEAD | cut -f1)
        spike=$(git ls-remote https://github.com/riscv-software-src/riscv-isa-sim HEAD | cut -f1)
        echo "gcc=$gcc" >> "$GITHUB_OUTPUT"
        echo "spike=$spike" >> "$GITHUB_OUTPUT"

    # restore + save (not the combined actions/cache) so the save happens right
    # after the build, not in an implicit post-step at the end of the job, which
    # is skipped when any later step fails or the job is cancelled.
    - name: Restore the RISC-V GCC from cache
      id: cache-gcc
      uses: actions/cache/restore@v6
      with:
        path: /opt/riscv-foundation/riscv32-elf
        key: riscv32-elf-picolibc-${{ steps.pins.outputs.gcc }}

    - name: Build the RISC-V GCC (Infra's GCC_SETUP.md, sections 1 to 3)
      if: steps.cache-gcc.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        apt-get update
        apt-get install -y --no-install-recommends \
          autoconf automake autotools-dev curl python3 \
          libmpc-dev libmpfr-dev libgmp-dev gawk build-essential bison flex texinfo \
          gperf libtool patchutils bc zlib1g-dev libexpat1-dev meson ninja-build git \
          cmake libglib2.0-dev expect device-tree-compiler libslirp-dev libzstd-dev \
          libncurses-dev ca-certificates

        CACHE_DIR=/opt/riscv-foundation/riscv32-elf
        SRC_DIR=/opt/riscv-foundation/riscv-gnu-toolchain
        git clone --depth 1 https://github.com/riscv-collab/riscv-gnu-toolchain "$SRC_DIR"
        git -C "$SRC_DIR" submodule sync --recursive
        git -C "$SRC_DIR" submodule update --init --depth 1 binutils gcc gdb picolibc
        COMMIT=$(git -C "$SRC_DIR" rev-parse HEAD)

        BUILD_DIR=$(mktemp -d -p /var/tmp riscv-gcc-build.XXXXXX)
        cd "$BUILD_DIR"
        rm -rf "$CACHE_DIR" && mkdir -p "$CACHE_DIR"
        "$SRC_DIR/configure" --prefix="$CACHE_DIR" --with-arch=rv32im --enable-picolibc
        make -j"$(nproc)"
        echo "$COMMIT" > "$CACHE_DIR/.tag"
        cd /
        rm -rf "$BUILD_DIR" "$SRC_DIR"

    - name: Save the RISC-V GCC to cache
      if: steps.cache-gcc.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: /opt/riscv-foundation/riscv32-elf
        key: riscv32-elf-picolibc-${{ steps.pins.outputs.gcc }}

    - name: Restore Spike from cache
      id: cache-spike
      uses: actions/cache/restore@v6
      with:
        path: /opt/riscv-foundation/spike
        key: spike-debug-start-${{ steps.pins.outputs.spike }}

    - name: Build Spike (Infra's SPIKE_SETUP.md, sections 1 to 3)
      if: steps.cache-spike.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        apt-get update
        apt-get install -y --no-install-recommends \
          build-essential git ca-certificates device-tree-compiler \
          libboost-regex-dev libboost-system-dev

        CACHE_DIR=/opt/riscv-foundation/spike
        SRC_DIR=/opt/riscv-foundation/riscv-isa-sim
        git clone --depth 1 https://github.com/riscv-software-src/riscv-isa-sim "$SRC_DIR"
        sed -i "s/^#define DEBUG_START .*/#define DEBUG_START        0x70000000/" "$SRC_DIR/riscv/platform.h"
        TAG="$(git -C "$SRC_DIR" rev-parse HEAD)-debug-start"

        BUILD_DIR=$(mktemp -d -p /var/tmp riscv-isa-sim-build.XXXXXX)
        cd "$BUILD_DIR"
        rm -rf "$CACHE_DIR" && mkdir -p "$CACHE_DIR"
        "$SRC_DIR/configure" --prefix="$CACHE_DIR"
        make -j"$(nproc)"
        make install
        echo "$TAG" > "$CACHE_DIR/.tag"
        cd /
        rm -rf "$BUILD_DIR" "$SRC_DIR"

    - name: Save Spike to cache
      if: steps.cache-spike.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: /opt/riscv-foundation/spike
        key: spike-debug-start-${{ steps.pins.outputs.spike }}

    - name: Put the toolchain on PATH and check it
      shell: bash
      # picolibc is what config.yaml links tests against.
      run: |
        echo "/opt/riscv-foundation/riscv32-elf/bin" >> "$GITHUB_PATH"
        echo "/opt/riscv-foundation/spike/bin" >> "$GITHUB_PATH"
        export PATH="/opt/riscv-foundation/riscv32-elf/bin:/opt/riscv-foundation/spike/bin:$PATH"
        # Captured in variables: `cmd | head -1` under pipefail (the default
        # for `shell: bash`) fails with SIGPIPE when the command has more
        # output than the first line, as spike --help does.
        gcc_version=$(riscv32-unknown-elf-gcc --version)
        echo "${gcc_version%%$'\n'*}"
        riscv32-unknown-elf-gcc --specs=picolibc.specs -E -x c /dev/null -o /dev/null
        riscv32-unknown-elf-gcc -print-multi-lib
        spike_help=$(spike --help 2>&1 || true)
        echo "${spike_help%%$'\n'*}"
