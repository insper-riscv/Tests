name: sim tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-sim:
    # Needs no hardware and no Quartus license (GHDL is open source), so
    # it runs on a GitHub-hosted runner, independent of any workstation.
    # The image is insper-riscv/Infra's toolchain image (docs/en/
    # TOOLCHAIN_IMAGE.md there): GHDL, the RISC-V GCC with picolibc, Spike
    # and uv already on PATH, so nothing is built or installed here. It is
    # the latest publication; to pin one, use its sha- tag.
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/insper-riscv/infra-toolchain:latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Checkout Core, Memory and TopLevel (the VHDL sources and the platform)
        # config.yaml extends ../../../TopLevel/platforms/internal-mem/config.yaml, and
        # the platform's paths are relative to this project's root:
        # "../Core/..." (the core), "../Memory/..." (the memories) and
        # "../TopLevel/..." (the simulation top, the runtime and the testbench).
        # True by accident on a workstation where this repo is nested at
        # RV32IM/Tests/ (see TopLevel's docs/HARDWARE_PROGRAMMING.md), but a bare
        # CI checkout of just this repo has no parent: clone the three next to it.
        run: |
          rm -rf ../Core ../Memory ../TopLevel
          git clone --depth 1 https://github.com/insper-riscv/Core.git ../Core
          git clone --depth 1 https://github.com/insper-riscv/Memory.git ../Memory
          git clone --depth 1 https://github.com/insper-riscv/TopLevel.git ../TopLevel

      - name: Install Python dependencies (riscv-tools, editable from tools/Tools, + its sim extra)
        run: uv sync

      - name: Generate rv32_test.h
        run: uv run riscv-tools --config tools/riscv_build/config.yaml generate-header

      - name: Check the memory map against every copy
        # TopLevel's platforms/internal-mem/platform.yaml is the source of truth; the boot ROM,
        # the runtime, the linker flags, config.yaml, the core's VHDL and the
        # Quartus IPs must all agree with it.
        run: uv run riscv-tools --root ../TopLevel check-memory-map --platform platforms/internal-mem/platform.yaml

      - name: Build sim test ROM images
        # compile also generates each C memory test's golden under Spike.
        run: uv run riscv-tools --config tools/riscv_build/config.yaml compile --emit hex

      - name: Run sim tests
        run: uv run riscv-tools --config tools/riscv_build/config.yaml sim

      - name: Run per-entity VHDL unit tests (tests/python/)
        run: uv run python tests/python/runner.py

      - name: Upload waveforms
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: waveforms
          path: "**/*.ghw"
          if-no-files-found: ignore
