name: sim tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-sim:
    # Needs no hardware and no Quartus license (GHDL is open source), so
    # it runs on a GitHub-hosted runner, independent of any workstation.
    # The RISC-V toolchain is built by the recipes of insper-riscv/Infra
    # (see the local action below) and cached across runs.
    runs-on: ubuntu-latest
    container:
      image: ghdl/ghdl:6.0.0-mcode-ubuntu-24.04

    steps:
      # ghdl/ghdl's image has no git, so actions/checkout falls back to
      # downloading via the GitHub REST API, which doesn't support
      # `submodules: true`. Installing git first lets checkout use a real
      # clone. libmpc3 and libmpfr6 are what the RISC-V gcc's cc1 links
      # against and the boost libraries are Spike's runtime, all needed
      # even when the toolchain comes from the cache.
      - name: Install git and the runtime libraries of the RISC-V gcc and Spike (missing from the ghdl/ghdl image)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates libmpc3 libmpfr6 \
            libboost-regex1.83.0 libboost-system1.83.0

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Checkout RV32IM (holds the VHDL sources)
        # config.yaml's sim.vhdl_sources are all "../src/...", relative
        # to this checkout: true by accident on a workstation where
        # this repo is nested at RV32IM/Tests/ (see
        # HARDWARE_PROGRAMMING.md), but a bare CI checkout of just this
        # repo has no RV32IM parent, so ghdl fails with e.g.
        # "/__w/Testes/src/rv32i_ctrl_consts.vhd" not found. Clone
        # RV32IM and symlink its src/ into the exact sibling path
        # config.yaml expects, same idea as real.yml's RV32IM checkout.
        run: |
          rm -rf ../RV32IM ../src
          git clone --depth 1 https://github.com/insper-riscv/RV32IM.git ../RV32IM
          ln -s RV32IM/src ../src

      - name: RISC-V GCC (picolibc) and Spike, built as Infra does, cached
        uses: ./.github/actions/riscv-toolchain

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install Python dependencies (riscv-tools, editable from tools/Tools, + its sim extra)
        run: uv sync

      - name: Generate rv32_test.h
        run: uv run riscv-tools --config tools/riscv_build/config.yaml generate-header

      - name: Build sim test ROM images
        # compile also generates each C memory test's golden under Spike.
        run: uv run riscv-tools --config tools/riscv_build/config.yaml compile --emit hex

      - name: Run sim tests
        run: uv run riscv-tools --config tools/riscv_build/config.yaml sim

      - name: Run per-entity VHDL unit tests (tests/python/)
        run: uv run python tests/python/runner.py

      - name: Upload waveforms
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: waveforms
          path: "**/*.ghw"
          if-no-files-found: ignore
