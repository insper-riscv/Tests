name: sim tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-sim:
    # Needs no hardware and no Quartus license (GHDL is open source), so
    # it runs on a GitHub-hosted runner, independent of any workstation.
    # insper-riscv/Infra's ELF image has GHDL, the RISC-V GCC with
    # picolibc, Spike and uv already on PATH, so nothing is built or
    # installed here. It is the latest publication; to pin one, use its
    # sha- tag.
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/insper-riscv/ci-elf:latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Insper-RISC-V (the platforms) and, inside it, Core, Memory, Peripherals and
          # Common-Components: the platform configs of tools/riscv_build/ name their files
          # as Insper-RISC-V/..., at the version this repository pins.
          submodules: recursive

      - name: Install Python dependencies (cocotb; riscv-tools comes from the image)
        run: uv sync

      - name: Run host-side UART harness tests
        run: /opt/riscv-tools/riscv-tools/bin/python -m unittest discover -s tests/host -v

      - name: The platform configs are the ones the platforms generate
        # riscv-tools platform sync writes each config.platform-*.yaml from the config.yaml of the
        # platform, with the Insper-RISC-V/ prefix; nobody edits them by hand.
        run: |
          platform_sync() { riscv-tools platform sync --prefix Insper-RISC-V --check --source "$1" --output "$2"; }
          platform_sync Insper-RISC-V/src/simulation/internal-mem/config.yaml tools/riscv_build/config.platform-internal-mem.yaml
          platform_sync Insper-RISC-V/src/simulation/internal-mem/config.fpga-sim.yaml tools/riscv_build/config.platform-internal-mem-fpga-sim.yaml
          platform_sync Insper-RISC-V/src/cyclone-v/de0-cv/config.yaml tools/riscv_build/config.platform-de0-cv.yaml

      - name: Generate rv32_test.h
        run: riscv-tools --config tools/riscv_build/config.yaml generate-header

      - name: Check the memory map against every copy
        # The platform.yaml of internal-mem is the source of truth; the boot ROM, the runtime, the
        # linker flags, config.yaml, the core's VHDL and the Quartus IPs must all agree with it.
        run: riscv-tools --root Insper-RISC-V check-memory-map --platform src/simulation/internal-mem/platform.yaml

      - name: Check the memory map of the de0-cv platform, with the FLASH behind the caches
        run: riscv-tools --root Insper-RISC-V check-memory-map --platform src/cyclone-v/de0-cv/platform.yaml

      - name: Build sim test ROM images
        # compile also generates each C memory test's golden under Spike.
        run: riscv-tools --config tools/riscv_build/config.yaml compile --emit hex

      - name: Run sim tests
        # The generic top exposes UART_RX/UART_TX. The same invocation runs
        # uart-tx, uart-echo, uart-errors and uart-stdio beside every other program.
        run: riscv-tools --config tools/riscv_build/config.yaml sim

      - name: Existing programs on the platform with the FLASH behind the caches
        # The FLASH is a chip right after the BOOT_ROM (0x800) reached through the instruction and data caches; every result
        # must be the one of internal-mem. The UART programs need the physical pins of the board top.
        run: |
          riscv-tools --config tools/riscv_build/config.sdram-flash-regression.yaml generate-header
          riscv-tools --config tools/riscv_build/config.sdram-flash-regression.yaml compile --emit hex
          riscv-tools --config tools/riscv_build/config.sdram-flash-regression.yaml sim \
            --exclude uart-echo,uart-tx,uart-errors,uart-stdio

      - name: Programs that use the SDRAM, with the FLASH behind the caches
        run: |
          riscv-tools --config tools/riscv_build/config.sdram-flash.yaml compile --emit hex
          riscv-tools --config tools/riscv_build/config.sdram-flash.yaml sim --exclude hex-id

      - name: The same programs with a slow FLASH chip
        # 120 clocks to the first word and 20 between the others, against 24 and 4: nothing may depend on the latency.
        run: |
          riscv-tools --config tools/riscv_build/config.sdram-flash-slow.yaml sim \
            --only flash-const,cache-sweep,code-sweep,selfmod-repeat,sdram-copy,sdram-loop

      - name: Run per-entity VHDL unit tests (tests/python/)
        run: uv run python tests/python/runner.py

      - name: Upload waveforms
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: waveforms
          path: "**/*.ghw"
          if-no-files-found: ignore
