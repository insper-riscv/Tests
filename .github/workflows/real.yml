name: real tests (FPGA)

on:
  push:
    branches: [main]     # <<< ADJUST if the default branch isn't main
  workflow_dispatch:
    inputs:
      confirm:
        description: "Repo secret FPGA_RUN_SECRET's value, to confirm you're allowed to run this on the physical FPGA"
        required: true
      peripherals_ref:
        description: "Peripherals branch/tag to test (use UART before that branch is merged)"
        required: true
        default: main
      toplevel_ref:
        description: "TopLevel branch/tag to test (use UART before that branch is merged)"
        required: true
        default: main

concurrency:
  # Serialize every ref against the same physical board. Canceling an active
  # run could interrupt quartus_pgm/JTAG and leave the board or the In-System
  # Memory Editor session in a bad state, so unlike sim.yml this must not use
  # cancel-in-progress.
  group: physical-fpga
  cancel-in-progress: false

jobs:
  test-real:
    # Only runs on main (or on demand) — needs licensed Quartus and
    # real hardware attached over JTAG, so it stays off feature
    # branches/PRs by default.
    runs-on: [self-hosted, quartus, fpga]   # <<< ADJUST to match your runner's labels
    env:
      # Prefer a stable /dev/serial/by-id path here if this runner exposes one.
      UART_PORT: /dev/ttyACM0               # <<< ADJUST for the Pico/Debug Probe
      # workflow_dispatch can coordinate feature branches across repositories;
      # pushes to main keep testing the released dependency branches.
      PERIPHERALS_REF: ${{ inputs.peripherals_ref || 'main' }}
      TOPLEVEL_REF: ${{ inputs.toplevel_ref || 'main' }}

    steps:
      - name: Authorize manual run
        # Only applies to workflow_dispatch: repo write access already
        # gates who can trigger this, but on a repo shared with people
        # who shouldn't touch the hardware, this adds a second check —
        # only someone who separately knows FPGA_RUN_SECRET can run it.
        # A push to main skips this: branch protection on main is the
        # gate for that path instead.
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirm }}" != "${{ secrets.FPGA_RUN_SECRET }}" ]; then
            echo "::error::confirmation does not match FPGA_RUN_SECRET — refusing to run on the FPGA"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Checkout Core, Memory, Peripherals and TopLevel
        # config.yaml extends TopLevel's platform config: quartus.project_dir is
        # "../TopLevel/platforms/internal-mem/quartus", relative to this checkout,
        # true by accident on a workstation where this repo is nested at
        # RV32IM/Tests/ (see TopLevel's docs/HARDWARE_PROGRAMMING.md). A bare CI
        # checkout has no such parent, so clone all four next to it; the
        # Quartus project names sources under the Core, Memory and Peripherals
        # siblings of TopLevel. This self-hosted runner's _work is not wiped
        # between runs, so start clean.
        run: |
          rm -rf ../Core ../Memory ../Peripherals ../TopLevel
          git clone --depth 1 https://github.com/insper-riscv/Core.git ../Core
          git clone --depth 1 https://github.com/insper-riscv/Memory.git ../Memory
          git clone --depth 1 --branch "$PERIPHERALS_REF" https://github.com/insper-riscv/Peripherals.git ../Peripherals
          git clone --depth 1 --branch "$TOPLEVEL_REF" https://github.com/insper-riscv/TopLevel.git ../TopLevel

      - name: Add Quartus to PATH
        # <<< ADJUST if Quartus is installed somewhere else on the
        # runner. Reached via /opt/altera_lite (a bind mount of
        # /home/picow/altera_lite in /etc/fstab), not the /home/picow
        # path directly — /home/picow is 750, and the runner user
        # deliberately isn't in the picow group, so it can't traverse
        # there at all.
        run: echo "/opt/altera_lite/25.1std/quartus/bin" >> "$GITHUB_PATH"

      - name: Check JTAG chain before wasting a compile on it
        # A known failure mode on this board (see HARDWARE_PROGRAMMING.md):
        # the onboard USB-Blaster's JTAG chain intermittently wedges —
        # `jtagconfig` reports "Unable to read device chain - JTAG
        # chain broken". For THIS specific symptom, only a physical
        # power-cycle of the board is confirmed to clear it (killall
        # jtagd was tried and tested during that investigation and did
        # NOT help). Still worth one killall+recheck here anyway,
        # cheaply, in case a *different* JTAG hiccup (stale/wedged
        # jtagd session from something else entirely) produces the
        # same "chain broken" message but responds to it — costs a few
        # seconds either way, and only escalates to a hard failure if
        # the retry doesn't clear it.
        #
        # Needs passwordless sudo for exactly this one command:
        #   echo 'runner ALL=(root) NOPASSWD: /usr/bin/killall jtagd' \
        #     | sudo tee /etc/sudoers.d/runner-jtagd
        run: |
          if jtagconfig 2>&1 | grep -qi "chain broken"; then
            echo "jtagconfig reports the JTAG chain is broken — trying killall jtagd + recheck once before giving up..."
            sudo killall jtagd || true
            sleep 3
            if jtagconfig 2>&1 | grep -qi "chain broken"; then
              echo "::error::JTAG chain still broken after killall jtagd. This board's known failure mode needs a physical power-cycle (~10s off, then on) — not fixable from software. See HARDWARE_PROGRAMMING.md."
              exit 1
            fi
            echo "Chain recovered after killall jtagd — continuing."
          fi

      - name: Check the RISC-V toolchain (installed by insper-riscv/Infra)
        # The GCC (with picolibc) and the patched Spike live in the
        # workstation's shared cache, /opt/riscv-foundation, with wrappers
        # in /usr/local/bin: Infra's GCC_SETUP.md and SPIKE_SETUP.md
        # install them, and this workflow builds and downloads nothing.
        # config.yaml links tests against picolibc, so fail here, with a
        # pointer, if this runner lacks it.
        run: |
          # Captured in variables: `cmd | head -1` under pipefail (the
          # default for `bash` here) fails with SIGPIPE when the command
          # has more output than the first line, as spike --help does.
          gcc_version=$(riscv32-unknown-elf-gcc --version)
          echo "${gcc_version%%$'\n'*}"
          if ! riscv32-unknown-elf-gcc --specs=picolibc.specs -E -x c /dev/null -o /dev/null; then
            echo "::error::riscv32-unknown-elf-gcc has no picolibc; install the toolchain as in insper-riscv/Infra's GCC_SETUP.md"
            exit 1
          fi
          spike_help=$(spike --help 2>&1 || true)
          echo "${spike_help%%$'\n'*}"

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install Python dependencies (riscv-tools, editable from tools/Tools)
        run: uv sync

      - name: Generate rv32_test.h
        run: uv run riscv-tools --config tools/riscv_build/config.sdram-regression.yaml generate-header

      - name: Build real test ROM images
        # The board runs the SDRAM platform (the SDRAM is the RAM; the host reaches it through the
        # JTAG debug port): the existing programs, then the ones that use the SDRAM.
        run: |
          uv run riscv-tools --config tools/riscv_build/config.sdram-regression.yaml compile --emit mif
          uv run riscv-tools --config tools/riscv_build/config.sdram.yaml compile --emit mif

      - name: Compile and program the uart-echo baseline
        # One full Quartus compile for the whole job. uart-echo is baked into
        # the SOF so the dedicated harness can always start from a known state;
        # every later program is loaded into FLASH live over JTAG.
        run: |
          uv run riscv-tools --config tools/riscv_build/config.yaml \
            program build/real/uart-echo.mif

      - name: Run dedicated physical UART tests
        # The preceding step has just programmed a fresh uart-echo image, so
        # avoid programming the same SOF a second time. The harness validates
        # uart-echo, replaces FLASH with uart-tx and uart-errors over JTAG,
        # then validates them.
        run: |
          uv run python tools/riscv_build/uart_hardware_test.py \
            --port "$UART_PORT" --skip-program

      - name: Run mailbox-only tests on the FPGA
        # PYTHONUNBUFFERED: Python fully-buffers stdout when it isn't a
        # TTY (always true under Actions' log capture), so without this
        # a 40+ minute run can show a blank log the whole time even
        # though it's progressing normally — not actually stuck.
        # `tee` also mirrors into build/real/latest.log (same fixed path
        # used for local `tail -f`), so a run kicked off by CI is
        # watchable the same way as a local one, from the runner itself.
        #
        # set -o pipefail: this shell (`bash -e {0}`, Actions' default)
        # does NOT set pipefail on its own — without it, `cmd | tee`
        # always exits 0 (tee's own exit code), so a failing test suite
        # would silently show this step as green.
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          uv run riscv-tools --config tools/riscv_build/config.yaml run \
            --exclude uart-echo,uart-tx,uart-errors \
            --skip-reconfigure | tee build/real/latest.log
