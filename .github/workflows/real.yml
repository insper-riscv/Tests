name: real tests (FPGA)

on:
  push:
    branches: [main]     # <<< ADJUST if the default branch isn't main
  workflow_dispatch:
    inputs:
      confirm:
        description: "Repo secret FPGA_RUN_SECRET's value, to confirm you're allowed to run this on the physical FPGA"
        required: true

concurrency:
  # Queue instead of overlapping/canceling: cancel-in-progress could
  # kill a run mid quartus_pgm/JTAG write and leave the board or the
  # In-System Memory Editor session in a bad state. Unlike sim.yml,
  # this must NOT cancel-in-progress.
  group: real-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-real:
    # Only runs on main (or on demand) — needs licensed Quartus and
    # real hardware attached over JTAG, so it stays off feature
    # branches/PRs by default.
    runs-on: [self-hosted, quartus, fpga]   # <<< ADJUST to match your runner's labels

    steps:
      - name: Authorize manual run
        # Only applies to workflow_dispatch: repo write access already
        # gates who can trigger this, but on a repo shared with people
        # who shouldn't touch the hardware, this adds a second check —
        # only someone who separately knows FPGA_RUN_SECRET can run it.
        # A push to main skips this: branch protection on main is the
        # gate for that path instead.
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirm }}" != "${{ secrets.FPGA_RUN_SECRET }}" ]; then
            echo "::error::confirmation does not match FPGA_RUN_SECRET — refusing to run on the FPGA"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Checkout Core, Memory and TopLevel (the real Quartus project)
        # config.yaml extends TopLevel's platform config: quartus.project_dir is
        # "../TopLevel/platforms/internal-mem/quartus", relative to this checkout,
        # true by accident on a workstation where this repo is nested at
        # RV32IM/Tests/ (see TopLevel's docs/HARDWARE_PROGRAMMING.md). A bare CI
        # checkout has no such parent, so clone the three next to it; the
        # Quartus project names the core's files as ../../../../Core/... and
        # the IPs as ../../../../Memory/ips/..., the siblings of TopLevel. This
        # self-hosted runner's _work is not wiped between runs, so start clean.
        run: |
          rm -rf ../Core ../Memory ../TopLevel
          git clone --depth 1 https://github.com/insper-riscv/Core.git ../Core
          git clone --depth 1 https://github.com/insper-riscv/Memory.git ../Memory
          git clone --depth 1 https://github.com/insper-riscv/TopLevel.git ../TopLevel

      - name: Check the Quartus project reads VHDL-2008
        # The core uses VHDL-2008 (e.g. `else generate` in the HAS_M selection), and
        # GHDL's --std=08 in the other workflows hides a Quartus project that still
        # reads VHDL-1993: only the several-minute synthesis would fail, with
        # "elsif or else statement inside a generate statement is not supported in
        # VHDL_1993". Fail in seconds instead, and keep every VHDL file the core
        # instantiates in the project (m_decode.vhd was once missing).
        run: |
          qsf=../TopLevel/platforms/internal-mem/quartus/core_fpga_test.qsf
          if ! grep -Eq '^set_global_assignment -name VHDL_INPUT_VERSION VHDL_2008' "$qsf"; then
            echo "::error::$qsf does not set VHDL_INPUT_VERSION VHDL_2008; Quartus would read the core as VHDL-1993 and fail in synthesis"
            exit 1
          fi
          for f in ../Core/common/*.vhd ../Core/I/*.vhd ../Core/M/m_decode.vhd; do
            grep -q "Core/${f#../Core/}" "$qsf" || { echo "::error::$f is not in $qsf"; exit 1; }
          done

      - name: Add Quartus to PATH
        # <<< ADJUST if Quartus is installed somewhere else on the
        # runner. Reached via /opt/altera_lite (a bind mount of
        # /home/picow/altera_lite in /etc/fstab), not the /home/picow
        # path directly — /home/picow is 750, and the runner user
        # deliberately isn't in the picow group, so it can't traverse
        # there at all.
        run: echo "/opt/altera_lite/25.1std/quartus/bin" >> "$GITHUB_PATH"

      - name: Check JTAG chain before wasting a compile on it
        # A known failure mode on this board (see HARDWARE_PROGRAMMING.md):
        # the onboard USB-Blaster's JTAG chain intermittently wedges —
        # `jtagconfig` reports "Unable to read device chain - JTAG
        # chain broken". For THIS specific symptom, only a physical
        # power-cycle of the board is confirmed to clear it (killall
        # jtagd was tried and tested during that investigation and did
        # NOT help). Still worth one killall+recheck here anyway,
        # cheaply, in case a *different* JTAG hiccup (stale/wedged
        # jtagd session from something else entirely) produces the
        # same "chain broken" message but responds to it — costs a few
        # seconds either way, and only escalates to a hard failure if
        # the retry doesn't clear it.
        #
        # Needs passwordless sudo for exactly this one command:
        #   echo 'runner ALL=(root) NOPASSWD: /usr/bin/killall jtagd' \
        #     | sudo tee /etc/sudoers.d/runner-jtagd
        run: |
          if jtagconfig 2>&1 | grep -qi "chain broken"; then
            echo "jtagconfig reports the JTAG chain is broken — trying killall jtagd + recheck once before giving up..."
            sudo killall jtagd || true
            sleep 3
            if jtagconfig 2>&1 | grep -qi "chain broken"; then
              echo "::error::JTAG chain still broken after killall jtagd. This board's known failure mode needs a physical power-cycle (~10s off, then on) — not fixable from software. See HARDWARE_PROGRAMMING.md."
              exit 1
            fi
            echo "Chain recovered after killall jtagd — continuing."
          fi

      - name: Pull the toolchain image (insper-riscv/Infra)
        # GCC with picolibc, Spike and uv come from the image, never from the
        # runner's own install, so the ROMs and the goldens are the same on every
        # machine. Only Quartus and the JTAG cable stay on the runner. The runner
        # user must be in the docker group. The image is the latest publication;
        # to pin one, use its sha- tag.
        run: docker pull ghcr.io/insper-riscv/infra-toolchain:latest

      - name: Install the `toolchain` wrapper (runs a command in the image)
        # Mounts the directory that holds this checkout and its siblings
        # (Core, Memory, TopLevel), as the runner user so the files it writes are
        # not owned by root, with its own virtualenv so it leaves the runner's
        # .venv alone. Same as RV32's scripts/toolchain.sh, which is not in this
        # repository.
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/toolchain" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm --user "\$(id -u):\$(id -g)" \\
            -e HOME=/tmp -e UV_LINK_MODE=copy -e UV_PROJECT_ENVIRONMENT=/tmp/venv \\
            -v "$(dirname "$GITHUB_WORKSPACE"):/workspace" \\
            -w "/workspace/$(basename "$GITHUB_WORKSPACE")" \\
            ghcr.io/insper-riscv/infra-toolchain:latest "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/toolchain"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Generate rv32_test.h
        run: toolchain uv run riscv-tools --config tools/riscv_build/config.yaml generate-header

      - name: Build real test ROM images and their goldens (in the image)
        # compile also generates each C memory test's golden under Spike.
        run: toolchain uv run riscv-tools --config tools/riscv_build/config.yaml compile --emit mif

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install Python dependencies for the board run (riscv-tools, editable from tools/Tools)
        # On the runner itself: this step talks to Quartus and the JTAG cable.
        run: uv sync

      - name: Run tests on the FPGA
        # PYTHONUNBUFFERED: Python fully-buffers stdout when it isn't a
        # TTY (always true under Actions' log capture), so without this
        # a 40+ minute run can show a blank log the whole time even
        # though it's progressing normally, not actually stuck.
        # riscv-tools' run_log also writes the whole run, Quartus output
        # included, to logs/real/latest.log (the previous one is archived),
        # so a run kicked off by CI is watchable from the runner with
        # `tail -f` like a local one.
        env:
          PYTHONUNBUFFERED: "1"
        run: uv run riscv-tools --config tools/riscv_build/config.yaml run

      - name: Upload the run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-run-log
          path: logs/real/latest.log
          if-no-files-found: ignore
