[project]
name = "riscv-workstation-tests"
version = "0.2.0"
description = "Real-hardware + simulation test suite for RV32IM, driven by riscv-tools (installed in the CI image)."
license = "Apache-2.0"
# Same Python as the ci-* images of Infra, which also carry riscv-tools.
requires-python = ">=3.14,<3.15"
dependencies = [
    # tests/python/runner.py runs the per-entity cocotb tests with cocotb (and its cocotb_tools),
    # at the version of the ci-* images. riscv-tools comes from the image, not from here.
    "cocotb==2.1.0",
]

[tool.uv]
# Not a distributable package itself: a project that runs scripts and tests with the
# riscv-tools of the image.
package = false
